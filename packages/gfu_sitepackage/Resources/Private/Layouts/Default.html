<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">


<f:layout name="Default"/>

<header class="container">
    <f:render partial="Page/Header" arguments="{_all}"/>
</header>
<main class="flex-shrink-0">
    <div class="container">
        <f:render section="Main" arguments="{_all}"/>
    </div>
</main>
<footer class="footer mt-auto py-3 bg-light">
    <f:render partial="Page/Footer" arguments="{_all}"/>
</footer>

<f:comment>
    Simple example for a fluid Layout template with minimal design based on bootstrap 5

    Path settings from constants in plugin.tx_gfusitepackage.view {...}
</f:comment>

</html>
