<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<f:render section="simple" arguments="{_all}" />

<f:section name="simple">
    <f:if condition="{mainNavigation}">
        <ul class="nav me-auto">
            <f:for each="{mainNavigation}" as="item" iteration="i">
                <li class="nav-item">
                    <f:link.typolink parameter="{item.link}" class="nav-link {f:if(condition: '{item.active}', then: 'active')}">{item.title}</f:link.typolink>
                </li>
            </f:for>
        </ul>
    </f:if>
</f:section>

</html>
