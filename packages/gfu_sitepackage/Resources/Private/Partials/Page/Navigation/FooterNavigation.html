<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<footer>
    <div class="shdw pt-7 pb-7.5 px-3 lg:px-4 xl:px-12">
        <div class="container-viewport relative border border-[var(--global-color-primary-primary-100)]">

        <div class="relative flex justify-center">
            <div class="absolute -top-[22px] px-4 bg-(--global-color-bw-white)">
                <ul class="flex gap-4 justify-center items-center text-[color:var(--global-color-primary-primary-100)]">
                    <f:if condition="{settings.linkInstagram}">
                        <li class="w-12 h-12 flex items-center justify-center">
                            <a class="group" href="{settings.linkInstagram}" target="_blank" aria-label="Instagram">
                                <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
                                    <use xlink:href="{f:uri.resource(path:'{settings.svgSpriteFile}', extensionName: 'vnc_sitepackage')}#icon-logo-instagram" />
                                </svg>
                            </a>
                        </li>
                    </f:if>
                    <f:if condition="{settings.linkYoutube}">
                        <li class="w-12 h-12 flex items-center justify-center">
                            <a class="group" href="{settings.linkYoutube}" target="_blank" aria-label="YouTube">
                                <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
                                    <use xlink:href="{f:uri.resource(path:'{settings.svgSpriteFile}', extensionName: 'vnc_sitepackage')}#icon-logo-youtube" />
                                </svg>
                            </a>
                        </li>
                    </f:if>
                    <f:if condition="{settings.linkFacebook}">
                        <li class="w-12 h-12 flex items-center justify-center">
                            <a class="group" href="{settings.linkFacebook}" target="_blank" aria-label="Facebook">
                                <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
                                    <use xlink:href="{f:uri.resource(path:'{settings.svgSpriteFile}', extensionName: 'vnc_sitepackage')}#icon-logo-facebook" />
                                </svg>
                            </a>
                        </li>
                    </f:if>
                </ul>
            </div>
        </div>

        <div class="px-8 py-10 gap-x-8 gap-y-6 grid grid-cols-1 md:grid-cols-12 max-w-[1392px] mx-auto">
            <div class="text-s text-footer md:col-start-3 md:col-span-4 xl:col-start-auto xl:col-span-3">
                <f:cObject typoscriptObjectPath="lib.footerContent.1"/>
            </div>
            <div class="text-s text-footer md:col-start-7 md:col-span-4 xl:col-start-auto xl:col-span-3">
                <f:cObject typoscriptObjectPath="lib.footerContent.2"/>
            </div>
            <div class="text-s text-footer md:col-start-3 md:col-span-4 xl:col-start-auto xl:col-span-3">
                <f:cObject typoscriptObjectPath="lib.footerContent.3"/>
            </div>
            <div class="text-s text-footer md:col-start-7 md:col-span-4 xl:col-start-auto xl:col-span-3">
                <f:cObject typoscriptObjectPath="lib.footerContent.4"/>
            </div>
        </div>

        <div class="relative flex justify-center mt-4">
            <div class="text-xxs absolute -bottom-[10px] px-4 bg-(--global-color-bw-white) flex items-center justify-center whitespace-nowrap">
                Copyright © 2025 Dinger‘s Gartencenter Köln
            </div>
        </div>
    </div>
    </div>

    <div class="container-viewport flex flex-wrap justify-center gap-0 md:gap-6 py-3">
        <f:for each="{footerNavigation}" as="item" iteration="iterator">
            <f:link.typolink parameter="{item.link}" target="{item.target}" class="text-link-footer p-1">
                {item.title}
            </f:link.typolink>
        </f:for>
    </div>
</footer>
</html>
