<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
        xmlns:n="http://typo3.org/ns/GeorgRinger/News/ViewHelpers"
        data-namespace-typo3-fluid="true">
<f:layout name="General"/>


<f:section name="content">
    <f:if condition="{news}">
        <f:then>
            <f:switch expression="{settings.templateLayout}">
                <f:case value="10">
                    <f:render section="Masonry" arguments="{_all}"/>
                </f:case>
                <f:defaultCase>
                    <f:render section="Default" arguments="{_all}"/>
                </f:defaultCase>
            </f:switch>
        </f:then>
        <f:else>
            <div class="no-news-found">
                <div class="alert alert-danger" role="alert">
                    <f:translate key="LLL:EXT:news/Resources/Private/Language/locallang.xml:list_nonewsfound"/>
                </div>
            </div>
        </f:else>
    </f:if>
</f:section>


<f:section name="Masonry">
    vnc mas
    <div data-template-origin="{settings.templateLayout}"
            class="news-list-view news-container "
            id="news-container-{contentObjectData.uid}"
            data-ajax-mode="load-more"
            data-history="push">
        <div class="news-articles" data-ajax-container="">
            <div class="grid">
                <f:if condition="{pageData.uid} != {settings.newsArchivPid}">
                    <f:render partial="List/NewsArchivTeaser" arguments="{settings:settings}"/>
                </f:if>
                <f:if condition="{settings.hidePagination}==0">
                    <f:render partial="List/Pagination" arguments="{pagination: pagination.pagination, paginator: pagination.paginator}"/>
                    <!-- Load‑More Button (wird nur bei data-ajax-mode=load-more benutzt) -->
                    <button class="btn btn-default button button--outline news-view-more" type="button">
                        <span class="label-default">Mehr laden</span>
                        <span class="label-loading" aria-hidden="true" hidden>Wird geladen…</span>
                    </button>
                </f:if>
            </div>
        </div>
    </div>
</f:section>


<f:section name="Default">
    <f:comment>Default section from V12 News Ext for TYPO3 V 13</f:comment>
    <!-- default list -->
    <div data-template-origin="{settings.templateLayout}" class="news-list-view" id="news-container-{contentObjectData.uid}">
        <f:if condition="{settings.hidePagination}">
            <f:then>
                <f:for each="{news}" as="newsItem" iteration="iterator">
                    <f:render partial="List/Item" arguments="{newsItem: newsItem,settings:settings,iterator:iterator}"/>
                </f:for>
            </f:then>
            <f:else>
                <f:if condition="{settings.list.paginate.insertAbove}">
                    <f:render partial="List/Pagination" arguments="{pagination: pagination.pagination, paginator: pagination.paginator}"/>
                </f:if>
                <f:for each="{pagination.paginator.paginatedItems}" as="newsItem" iteration="iterator">
                    <f:render partial="List/Item" arguments="{newsItem: newsItem,settings:settings,iterator:iterator}"/>
                </f:for>
                <f:if condition="{settings.list.paginate.insertBelow}">
                    <f:render partial="List/Pagination" arguments="{pagination: pagination.pagination, paginator: pagination.paginator}"/>
                </f:if>
            </f:else>
        </f:if>
    </div>
</f:section>
</html>
